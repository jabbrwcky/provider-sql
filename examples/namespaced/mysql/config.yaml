---
apiVersion: mysql.sql.m.crossplane.io/v1alpha1
kind: ProviderConfig
metadata:
  name: default
  namespace: default
spec:
  credentials:
    source: MySQLConnectionSecret
    connectionSecretRef:
      name: db-conn
  # tls one of preferred(default), skip-verify, true, or custom
  tls: preferred
  # connectionPool tunes the shared DB connection pool. All fields are optional;
  # omitted fields use the defaults shown below.
  connectionPool:
    maxOpenConnections: 10
    maxIdleConnections: 5
    maxConnLifetime: 1h
    maxConnIdleTime: 10m
  # sessionVariables are set via `SET key = value` on every new physical
  # connection. String values must be quoted, since they are used verbatim
  # as the right-hand side of the SET statement. Example: force Percona/Galera
  # DDL to use Non-Blocking Operation for online schema upgrades.
  sessionVariables:
    wsrep_OSU_method: "'NBO'"
